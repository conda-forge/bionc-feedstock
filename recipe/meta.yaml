{% set name = "bionc" %}
{% set version = "0.12.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Ipuch/bioNC/archive/{{ version }}.tar.gz
  sha256: c0e843a37df52e78586f34c9a0a5fb16d3c1633969ac05b5cfc6e5d1ab932285

build:
  number: 0
  noarch: python
  script: "python -m pip install . -vv"

requirements:
  host:
    - pip
    - hatchling
    - python >={{ python_min }}
  run:
    - python >={{ python_min }}
    - numpy
    - packaging
    - casadi
    - ezc3d
    - plotly
    - pyomeca
    - dill
    - biorbd
    - numba
    - pyorerun
    - proxsuite

test:
  imports:
    - bionc
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Ipuch/bioNC
  summary: Natural Coordinates with python for biomechanics
  description: |
    This repository contains the source code for the bioNC library, a python package for biomechanics and natural coordinates formalism. Inverse and Forward approach are implemented.
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  dev_url: https://github.com/Ipuch/bioNC

extra:
  recipe-maintainers:
    - ipuch
